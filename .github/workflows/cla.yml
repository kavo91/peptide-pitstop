name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        # A CLA covers EXTERNAL contributions. A pull request opened from a
        # branch in this repository is the owner, who already holds copyright —
        # gating those adds no protection and reports a permanent failure,
        # because the bot counts the "Co-Authored-By" trailer on our own commits
        # as an unsigned contributor with no GitHub identity to allowlist.
        # Fork PRs (head repo != this repo) still run the full check.
        if: >-
          (github.event_name == 'issue_comment'
            && github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || (github.event_name == 'pull_request_target'
            && github.event.pull_request.head.repo.full_name != github.repository)
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Recommended: a classic PAT (repo scope) stored as PERSONAL_ACCESS_TOKEN so the
          # action can record signatures reliably. Falls back to GITHUB_TOKEN for same-repo.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/kavo91/peptide-pitstop/blob/main/CLA.md"
          # Signatures live on their own branch, NOT main. main is protected
          # (enforce_admins, PR required), and the action commits the signature
          # file directly — against a protected branch that fails with
          # "Could not create file: Changes must be made through a pull request."
          branch: cla-signatures
          # Co-authors count as committers here. Commits carry a
          # "Co-Authored-By: Claude Opus 5" trailer, which has no GitHub identity
          # and would otherwise be treated as an unsigned contributor.
          allowlist: kavo91,dependabot[bot],Claude Opus 5,claude[bot]
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
